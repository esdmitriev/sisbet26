<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СИСЬбет 2026</title>
<style>

  :root {
    --bg: #080c14; --surface: #0e1520; --card: #131d2e; --border: #1a2540;

  .header { padding: 24px 20px 0; display: flex; flex-direction: column; align-items: center; }
  .tournament-name { margin-top: 10px; font-size: 1.5rem; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; background: linear-gradient(90deg, #f5b800, #ff6ec7, #f5b800); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .tournament-sub { font-size: 0.62rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 3px; }
  .stats-row { margin-top: 16px; display: flex; justify-content: center; gap: 28px; }
  .stat-val { font-size: 1.1rem; font-weight: 700; text-align: center; }
  .stat-lbl { font-size: 0.65rem; color: var(--muted); text-align: center; margin-top: 2px; letter-spacing: 0.5px; }
  .tabs { display: flex; justify-content: center; gap: 2px; margin: 18px 16px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tab-btn { background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; padding: 8px 16px; font-size: 0.82rem; font-weight: 400; color: var(--muted); transition: all 0.15s; }
  .tab-btn.active { color: var(--gold); font-weight: 700; border-bottom-color: var(--gold); }
  .panel { display: none; padding: 16px; }
  .panel.active { display: block; }
  .lb-card { border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--border); }
  .lb-card.leader { background: linear-gradient(90deg, #1a2200 0%, var(--card) 100%); border-color: var(--gold-dim); }
  .lb-rank { font-size: 0.9rem; width: 28px; text-align: center; color: var(--muted); font-weight: 700; }
  .lb-rank.top { font-size: 1.4rem; }
  .lb-tags { margin-top: 5px; display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .tag-teal { background: #00d4a018; color: var(--teal); }
  .tag-blue { background: #38bdf818; color: var(--blue); }
  .tag-purple { background: #a78bfa18; color: var(--purple); }
  .lb-pts { font-size: 1.6rem; font-weight: 800; line-height: 1; text-align: right; }
  .lb-pts-lbl { font-size: 0.65rem; color: var(--muted); margin-top: 2px; text-align: right; }
  .pts-legend { text-align: center; margin-top: 20px; color: var(--muted); font-size: 0.75rem; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 480px; }
  th { background: var(--surface); color: var(--muted); padding: 8px 12px; font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--border); text-align: center; }
  th.left { text-align: left; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; text-align: center; }
  td.left { text-align: left; }
  .match-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .match-head { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .match-title { font-weight: 700; font-size: 0.95rem; }
  .match-date { color: var(--muted); font-size: 0.72rem; margin-top: 2px; }
  .match-score { font-size: 1.4rem; font-weight: 800; color: var(--teal); }
  .match-pending { font-size: 0.75rem; color: var(--muted); background: var(--surface); padding: 4px 10px; border-radius: 20px; }
  .bets-row { padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .bet-chip { background: var(--surface); border-radius: 8px; padding: 6px 10px; min-width: 90px; }
  .bet-chip-name { font-size: 0.65rem; color: var(--muted); margin-bottom: 2px; }
  .bet-chip-val { font-weight: 700; font-size: 0.9rem; display: flex; justify-content: space-between; }
  .rule-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; display: flex; gap: 16px; }
  .rule-num { font-size: 1rem; font-weight: 900; color: var(--gold); font-family: monospace; min-width: 28px; padding-top: 1px; }
  .rule-text { font-size: 0.88rem; line-height: 1.5; }
  .scoring-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 0.78rem; line-height: 1.7; color: var(--muted); }
  .day-header { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; padding: 12px 4px 6px; }
  .player-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .player-tab-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
  .player-tab-btn.active { border-color: var(--gold); color: var(--gold); font-weight: 700; background: #1a2200; }
  .player-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .player-header { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

  .player-match-row:last-child { border-bottom: none; }
  .pm-match { flex: 1; font-size: 0.82rem; font-weight: 600; }
  .pm-date { font-size: 0.65rem; color: var(--muted); margin-top: 1px; }
  .pm-bet { font-size: 0.85rem; font-weight: 700; min-width: 40px; text-align: center; }
  .pm-arrow { color: var(--muted); font-size: 0.75rem; }
  .pm-result { font-size: 0.85rem; font-weight: 700; min-width: 40px; text-align: center; }
  .pm-pts { min-width: 44px; text-align: right; font-weight: 800; font-size: 0.9rem; }
  .pm-badge { font-size: 0.65rem; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
  .viz-section { margin-bottom: 28px; }
  .viz-title { font-size: 0.78rem; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .heatmap-wrap { overflow-x: auto; }
  .heatmap-table { border-collapse: separate; border-spacing: 3px; font-size: 0.75rem; }
  .heatmap-table th { color: var(--muted); font-size: 0.68rem; font-weight: 600; padding: 4px 6px; text-align: center; white-space: nowrap; }
  .heatmap-table th.match-lbl { text-align: right; min-width: 120px; max-width: 140px; color: var(--sub); font-size: 0.7rem; font-weight: 400; padding-right: 8px; }
  .hm-cell { width: 52px; height: 36px; border-radius: 6px; text-align: center; vertical-align: middle; font-weight: 700; font-size: 0.78rem; cursor: default; transition: transform 0.1s; }
  .hm-cell:hover { transform: scale(1.08); }
  .hm-exact { background: #00d4a022; color: #00d4a0; border: 1px solid #00d4a044; }
  .hm-diff  { background: #38bdf822; color: #38bdf8; border: 1px solid #38bdf844; }
  .hm-res   { background: #a78bfa22; color: #a78bfa; border: 1px solid #a78bfa44; }
  .hm-miss  { background: #f8717122; color: #f87171; border: 1px solid #f8717144; }
  .hm-none  { background: #1a254033; color: #4a5878; border: 1px solid #1a254055; font-size: 0.65rem; }
  .chart-wrap { position: relative; width: 100%; }
  canvas#lineChart { width: 100% !important; }
  .legend-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; color: var(--sub); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-name { width: 80px; font-size: 0.78rem; text-align: right; color: var(--sub); flex-shrink: 0; }
  .bar-track { flex: 1; background: #1a2540; border-radius: 20px; height: 22px; position: relative; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 20px; display: flex; align-items: center; padding-left: 8px; font-size: 0.7rem; font-weight: 700; transition: width 0.6s ease; }
  .bar-pts { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 0.72rem; color: var(--muted); }
</style>

    bets:{"Виктор Б.":[3,0],"Андрей С.":[2,0],"Игорь М.":[3,0],"Евгений":[5,0],"Иван С.":[4,1]} },

const RULES = [
  { num:"01", text:"Изменение ставки разрешено новым сообщением. Если сообщение помечено «изменено» — ставка не принимается." },
  { num:"02", text:"С этапа ¼ финала лидер таблицы делает ставку не позднее чем за час до начала матча. Иначе ставка не принимается. Правило действует только на лидера." },
];

function calcScore(bet, result) {
  if (!result || !bet) return null;
  const [b1,b2]=bet,[r1,r2]=result;
  if(b1===r1&&b2===r2) return{pts:3,type:"exact"};
  if(b1-b2===r1-r2) return{pts:2,type:"diff"};
  const out=(a,b)=>a>b?1:a<b?-1:0;
  if(out(b1,b2)===out(r1,r2)) return{pts:1,type:"res"};
  return{pts:0,type:"miss"};
}

const TC={exact:"var(--teal)",diff:"var(--blue)",res:"var(--purple)",miss:"var(--red)"};

function getStats(){
  return PLAYERS.map(p=>{
    let pts=0,exact=0,diff=0,res=0,played=0;
    MATCHES.forEach(m=>{
      if(!m.result)return;
      const bet=m.bets[p];if(!bet)return;
      const r=calcScore(bet,m.result);if(!r)return;
      pts+=r.pts;played++;
      if(r.type==="exact")exact++;
      if(r.type==="diff")diff++;
      if(r.type==="res")res++;
    });
    return{name:p,pts,exact,diff,res,played};
  }).sort((a,b)=>b.pts-a.pts);
}

function showTab(id,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+id).classList.add('active');
  if(id==='viz') setTimeout(renderViz, 50);
  if(id==='player') renderPlayer(false);
}

const PLAYER_COLORS = ["#f5b800","#00d4a0","#38bdf8","#a78bfa","#f87171"];

let currentPlayer = 0;

function renderPlayer(panelOnly) {
  const p = PLAYERS[currentPlayer];
  const color = PLAYER_COLORS[currentPlayer];
  const stats = getStats().find(s => s.name === p) || {pts:0,exact:0,diff:0,res:0,played:0};

  // Player selector buttons
  const btns = PLAYERS.map((name, i) =>
    `<button class="player-tab-btn ${i===currentPlayer?'active':''}" onclick="currentPlayer=${i};renderPlayer(true)" style="${i===currentPlayer?'border-color:'+PLAYER_COLORS[i]+';color:'+PLAYER_COLORS[i]+';':''}">${name}</button>`
  ).join('');

  // Matches for this player
  const rows = MATCHES.map(m => {
    const bet = m.bets[p];
    if (!bet) return '';
    const r = m.result ? calcScore(bet, m.result) : null;
    const ptsColor = r ? TC[r.type] : 'var(--muted)';
    const typeLabel = r ? (r.type==='exact'?'точно':r.type==='diff'?'разница':r.type==='res'?'исход':'мимо') : '';
    const typeBg = r ? (r.type==='exact'?'#00d4a018':r.type==='diff'?'#38bdf818':r.type==='res'?'#a78bfa18':'#f8717118') : '';
    const resultStr = m.result ? `${m.result[0]}:${m.result[1]}` : '?';
    const ptsStr = r ? (r.pts>0?'+'+r.pts:'✕') : '—';
    return `<div class="player-match-row">
      <div style="flex:1">
        <div class="pm-match">${m.home} — ${m.away}</div>
        <div class="pm-date">${m.date}</div>
      </div>
      <div class="pm-bet" style="color:${color}">${bet[0]}:${bet[1]}</div>
      <div class="pm-arrow">→</div>
      <div class="pm-result" style="color:${m.result?'var(--text)':'var(--muted)'}">${resultStr}</div>
      <div style="min-width:70px;text-align:right">
        ${r ? `<span class="pm-badge" style="background:${typeBg};color:${ptsColor}">${typeLabel}</span>` : '<span style="color:var(--muted);font-size:0.72rem">ожидается</span>'}
      </div>
      <div class="pm-pts" style="color:${ptsColor}">${ptsStr}</div>
    </div>`;
  }).join('');

  // Summary mini-stats
  const miss = stats.played - stats.exact - stats.diff - stats.res;
  const acc = stats.played > 0 ? Math.round(((stats.played-miss)/stats.played)*100) : 0;

  const html = `<div class="player-tabs">${btns}</div>
  <div class="player-card">
    <div class="player-header">
      <div>
        <div style="font-size:1.1rem;font-weight:800;color:${color}">${p}</div>
        <div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap">
          <span style="font-size:0.72rem;color:var(--muted)">Матчей: <b style="color:var(--text)">${stats.played}</b></span>
          <span style="font-size:0.72rem;color:var(--teal)">✓ ${stats.exact}</span>
          <span style="font-size:0.72rem;color:var(--blue)">≈ ${stats.diff}</span>
          <span style="font-size:0.72rem;color:var(--purple)">→ ${stats.res}</span>
          <span style="font-size:0.72rem;color:var(--muted)">Попадание: <b style="color:${color}">${stats.played>0?acc+'%':'—'}</b></span>
        </div>
      </div>
      <div style="text-align:right">
        <div style="font-size:2rem;font-weight:900;color:${color};line-height:1">${stats.pts}</div>
        <div style="font-size:0.65rem;color:var(--muted)">очков</div>
      </div>
    </div>
    ${rows || '<div style="padding:20px;text-align:center;color:var(--muted)">Нет ставок</div>'}
  </div>`;

  document.getElementById('panel-player').innerHTML = html;
}

function renderViz(){
  const stats = getStats();
  const playedMatches = MATCHES.filter(m => m.result);

  // ── HEATMAP ──────────────────────────────────────────
  let hmHTML = '<div class="viz-section"><div class="viz-title">🔥 Тепловая карта очков</div><div class="heatmap-wrap"><table class="heatmap-table"><thead><tr><th class="match-lbl"></th>';
  PLAYERS.forEach((p,i) => { hmHTML += `<th style="color:${PLAYER_COLORS[i]}">${p.split(' ')[0]}</th>`; });
  hmHTML += '</tr></thead><tbody>';

  MATCHES.forEach(m => {
    hmHTML += `<tr><th class="match-lbl">${m.home.substring(0,3).toUpperCase()}–${m.away.substring(0,3).toUpperCase()} <span style="font-size:0.62rem;color:var(--muted)">${m.date}</span></th>`;
    PLAYERS.forEach(p => {
      const bet = m.bets[p];
      const r = bet && m.result ? calcScore(bet, m.result) : null;
      if (!bet) { hmHTML += `<td class="hm-cell hm-none">—</td>`; return; }
      if (!m.result) { hmHTML += `<td class="hm-cell hm-none">${bet[0]}:${bet[1]}</td>`; return; }
      const cls = r ? `hm-${r.type}` : 'hm-none';
      const label = r && r.pts > 0 ? `+${r.pts}` : r ? '✕' : '?';
      hmHTML += `<td class="hm-cell ${cls}" title="${p}: ${bet[0]}:${bet[1]}">${label}</td>`;
    });
    hmHTML += '</tr>';
  });
  hmHTML += '</tbody></table></div></div>';

  // ── BAR CHART ────────────────────────────────────────
  const maxPts = Math.max(...stats.map(s => s.pts), 1);
  let barHTML = '<div class="viz-section"><div class="viz-title">🏅 Текущие очки</div>';
  stats.forEach((p, i) => {
    const origIdx = PLAYERS.indexOf(p.name);
    const color = PLAYER_COLORS[origIdx];
    const pct = Math.max((p.pts / maxPts) * 100, 3);
    barHTML += `<div class="bar-row">
      <div class="bar-name">${p.name.split(' ')[0]}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct}%;background:${color}22;border:1px solid ${color}44;color:${color}">${p.pts > 0 ? p.pts + ' оч.' : ''}</div>
        <span class="bar-pts">${p.pts}</span>
      </div>
    </div>`;
  });
  barHTML += '</div>';

  // ── LINE CHART ───────────────────────────────────────
  let lineHTML = '<div class="viz-section"><div class="viz-title">📈 Динамика очков по матчам</div><div class="chart-wrap"><canvas id="lineChart" height="220"></canvas></div>';
  lineHTML += '<div class="legend-row">';
  PLAYERS.forEach((p,i) => { lineHTML += `<div class="legend-item"><div class="legend-dot" style="background:${PLAYER_COLORS[i]}"></div>${p}</div>`; });
  lineHTML += '</div></div>';

  // ── ACCURACY TABLE ────────────────────────────────────
  let accHTML = '<div class="viz-section"><div class="viz-title">🎯 Точность прогнозов</div><div class="table-wrap"><table style="width:100%;border-collapse:collapse;font-size:0.8rem"><thead><tr>';
  ['Игрок','Сыграно','Точных','Разница','Исход','Промах','% попадания'].forEach(h => {
    accHTML += `<th style="background:var(--surface);color:var(--muted);padding:7px 10px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid var(--border);text-align:center">${h}</th>`;
  });
  accHTML += '</tr></thead><tbody>';
  stats.forEach((p,i) => {
    const origIdx = PLAYERS.indexOf(p.name);
    const color = PLAYER_COLORS[origIdx];
    const miss = p.played - p.exact - p.diff - p.res;
    const acc = p.played > 0 ? Math.round(((p.played - miss) / p.played) * 100) : 0;
    accHTML += `<tr>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);font-weight:700;color:${color}">${p.name}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;color:var(--muted)">${p.played}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;color:var(--teal);font-weight:600">${p.exact}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;color:var(--blue);font-weight:600">${p.diff}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;color:var(--purple);font-weight:600">${p.res}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;color:var(--red);font-weight:600">${miss}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;color:${color};font-weight:700">${p.played > 0 ? acc + '%' : '—'}</td>
    </tr>`;
  });
  accHTML += '</tbody></table></div></div>';

  document.getElementById('panel-viz').innerHTML = hmHTML + barHTML + lineHTML + accHTML;

  // Draw line chart with canvas
  const canvas = document.getElementById('lineChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth || 340;
  const H = 220;
  canvas.width = W; canvas.height = H;

  const pad = {t:20, r:20, b:40, l:36};
  const cW = W - pad.l - pad.r;
  const cH = H - pad.t - pad.b;

  // Build cumulative data
  const cumData = PLAYERS.map(() => [0]);
  playedMatches.forEach(m => {
    PLAYERS.forEach((p, pi) => {
      const prev = cumData[pi][cumData[pi].length - 1];
      const bet = m.bets[p];
      const r = bet ? calcScore(bet, m.result) : null;
      cumData[pi].push(prev + (r ? r.pts : 0));
    });
  });

  const maxY = Math.max(...cumData.flat(), 1);
  const labels = ['Старт', ...playedMatches.map(m => m.home.substring(0,3))];
  const xStep = labels.length > 1 ? cW / (labels.length - 1) : cW;

  // Grid
  ctx.strokeStyle = '#1a2540'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + cH - (i / 4) * cH;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + cW, y); ctx.stroke();
    ctx.fillStyle = '#4a5878'; ctx.font = '10px Segoe UI'; ctx.textAlign = 'right';
    ctx.fillText(Math.round((i / 4) * maxY), pad.l - 4, y + 3);
  }

  // X labels
  ctx.fillStyle = '#4a5878'; ctx.font = '9px Segoe UI'; ctx.textAlign = 'center';
  labels.forEach((lbl, i) => {
    const x = pad.l + i * xStep;
    ctx.fillText(lbl, x, H - 8);
  });

  // Lines
  PLAYERS.forEach((p, pi) => {
    const color = PLAYER_COLORS[pi];
    const data = cumData[pi];
    ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2.5;
    ctx.shadowColor = color; ctx.shadowBlur = 4;
    data.forEach((val, i) => {
      const x = pad.l + i * xStep;
      const y = pad.t + cH - (val / maxY) * cH;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke(); ctx.shadowBlur = 0;

    // Dots
    data.forEach((val, i) => {
      const x = pad.l + i * xStep;
      const y = pad.t + cH - (val / maxY) * cH;
      ctx.beginPath(); ctx.fillStyle = color; ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
    });
  });
}

function renderAll(){
  const stats=getStats();
  const played=MATCHES.filter(m=>m.result).length;
  document.getElementById('stat-prize').textContent=(PLAYERS.length*BUY_IN).toLocaleString('ru-RU')+' ₽';
  document.getElementById('stat-played').textContent=played+' / '+MATCHES.length;
  document.getElementById('stat-players').textContent=PLAYERS.length;
  renderBoard(stats);renderBets();renderMatches();renderRules();
}

let expandedPlayer = null;

function getRank(stats) {
  // Assign ranks respecting ties
  const ranks = [];
  let rank = 1;
  for (let i = 0; i < stats.length; i++) {
    if (i > 0 && stats[i].pts < stats[i-1].pts) rank = i + 1;
    ranks.push(rank);
  }
  return ranks;
}

function renderPlayerDetail(playerName) {
  const p = playerName;
  const origIdx = PLAYERS.indexOf(p);
  const color = PLAYER_COLORS[origIdx];
  const playedMatches = MATCHES.filter(m => m.result && m.bets[p]);
  const sortedMatches = [...playedMatches].sort((a, b) => {
    const ra = calcScore(a.bets[p], a.result);
    const rb = calcScore(b.bets[p], b.result);
    return (rb ? rb.pts : 0) - (ra ? ra.pts : 0);
  });

  return `<div style="background:var(--bg);border-radius:0 0 12px 12px;overflow:hidden;border:1px solid ${color}44;border-top:none">
    ${sortedMatches.map(m => {
      const bet = m.bets[p];
      const r = calcScore(bet, m.result);
      const ptsColor = r ? TC[r.type] : 'var(--muted)';
      const typeLabel = r ? (r.type==='exact'?'точно':r.type==='diff'?'разница':r.type==='res'?'исход':'мимо') : '';
      const typeBg = r ? (r.type==='exact'?'#00d4a018':r.type==='diff'?'#38bdf818':r.type==='res'?'#a78bfa18':'#f8717118') : '';
      return `<div style="display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid #0a0e1a">
        <div style="flex:1;font-size:0.8rem">
          <span style="font-weight:600">${m.home} — ${m.away}</span>
          <span style="color:var(--muted);font-size:0.68rem;margin-left:6px">${m.date}</span>
        </div>
        <div style="font-weight:700;font-size:0.82rem;color:${color};min-width:34px;text-align:center">${bet[0]}:${bet[1]}</div>
        <div style="color:var(--muted);font-size:0.72rem">→</div>
        <div style="font-weight:700;font-size:0.82rem;min-width:34px;text-align:center">${m.result[0]}:${m.result[1]}</div>
        <div style="min-width:60px;text-align:right">
          <span style="background:${typeBg};color:${ptsColor};font-size:0.68rem;padding:2px 7px;border-radius:10px;font-weight:600">${typeLabel}</span>
        </div>
        <div style="font-weight:800;font-size:0.88rem;color:${ptsColor};min-width:28px;text-align:right">${r&&r.pts>0?'+'+r.pts:r?'✕':'—'}</div>
      </div>`;
    }).join('')}
    ${MATCHES.filter(m => !m.result && m.bets[p]).map(m => {
      const bet = m.bets[p];
      return `<div style="display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid #0a0e1a;opacity:0.5">
        <div style="flex:1;font-size:0.8rem"><span style="font-weight:600">${m.home} — ${m.away}</span><span style="color:var(--muted);font-size:0.68rem;margin-left:6px">${m.date}</span></div>
        <div style="font-weight:700;font-size:0.82rem;color:${color};min-width:34px;text-align:center">${bet[0]}:${bet[1]}</div>
        <div style="color:var(--muted);font-size:0.72rem">→</div>
        <div style="color:var(--muted);font-size:0.82rem;min-width:34px;text-align:center">?</div>
        <div style="min-width:60px;text-align:right"><span style="color:var(--muted);font-size:0.68rem">ожидается</span></div>
        <div style="min-width:28px"></div>
      </div>`;
    }).join('')}
  </div>`;
}

function togglePlayer(name) {
  expandedPlayer = expandedPlayer === name ? null : name;
  const stats = getStats();
  renderBoard(stats);
}

function renderBoard(stats){
  const ranks = getRank(stats);
  const rankEmoji = ['🥇','🥈','🥉'];

  document.getElementById('panel-board').innerHTML = stats.map((p, i) => {
    const rank = ranks[i];
    const isFirst = rank === 1 && p.pts > 0;
    const origIdx = PLAYERS.indexOf(p.name);
    const color = PLAYER_COLORS[origIdx];
    const isExpanded = expandedPlayer === p.name;
    const tags = [
      p.exact>0?`<span class="tag tag-teal">✓ ${p.exact} точных</span>`:'',
      p.diff>0?`<span class="tag tag-blue">≈ ${p.diff} разница</span>`:'',
      p.res>0?`<span class="tag tag-purple">→ ${p.res} исход</span>`:'',
      p.played===0?`<span style="font-size:0.72rem;color:var(--muted)">матчей не сыграно</span>`:'',
    ].join('');

    return `<div style="margin-bottom:${isExpanded?'0':'8px'}">
      <div class="lb-card ${isFirst?'leader':''}" onclick="togglePlayer('${p.name}')" style="cursor:pointer;border-radius:${isExpanded?'12px 12px 0 0':'12px'};border-color:${isExpanded?color+'88':''}">
        <div class="lb-rank ${rank<=3?'top':''}">${rankEmoji[rank-1]||rank}</div>
        <div style="flex:1">
          <div style="font-weight:700;font-size:0.95rem;color:${isExpanded?color:'var(--text)'}">${p.name}</div>
          <div class="lb-tags">${tags}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div>
            <div class="lb-pts" style="color:${isFirst?'var(--gold)':isExpanded?color:'var(--text)'}">${p.pts}</div>
            <div class="lb-pts-lbl">очков</div>
          </div>
          <div style="color:var(--muted);font-size:0.9rem;transition:transform 0.2s;transform:rotate(${isExpanded?'90':'0'}deg)">›</div>
        </div>
      </div>
      ${isExpanded ? renderPlayerDetail(p.name) : ''}
    </div>`;
  }).join('') + `<div class="pts-legend">✓ точный счёт = 3 · ≈ разница мячей = 2 · → исход = 1<br><span style="font-size:0.68rem">нажми на игрока чтобы увидеть детали</span></div>`;
}

function renderBets(){
  const rows=MATCHES.map(m=>{
    const rl=m.result?`<div style="color:var(--teal);font-size:0.72rem;margin-top:2px">Итог: ${m.result[0]}:${m.result[1]}</div>`:`<div style="color:var(--muted);font-size:0.68rem;margin-top:2px">ожидается</div>`;
    const cells=PLAYERS.map(p=>{
      const bet=m.bets[p];
      const r=bet&&m.result?calcScore(bet,m.result):null;
      if(!bet)return`<td style="color:var(--muted)">—</td>`;
      const col=r?TC[r.type]:'var(--text)';
      const pts=r?(r.pts>0?`<div style="font-size:0.65rem;color:${col}">+${r.pts}</div>`:`<div style="font-size:0.65rem;color:var(--red)">✕</div>`):'';
      return`<td><div style="font-weight:600;color:${col}">${bet[0]}:${bet[1]}</div>${pts}</td>`;
    }).join('');
    return`<tr><td class="left"><div style="font-weight:600;font-size:0.78rem">${m.home} — ${m.away}</div><div style="color:var(--muted);font-size:0.65rem">${m.date}</div>${rl}</td>${cells}</tr>`;
  }).join('');
  document.getElementById('panel-bets').innerHTML=`<div class="table-wrap"><table><thead><tr><th class="left" style="min-width:130px">Матч</th>${PLAYERS.map(p=>`<th>${p}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderMatches(){
  document.getElementById('panel-matches').innerHTML=[...MATCHES].reverse().map(m=>{
    const scoreEl=m.result?`<div class="match-score">${m.result[0]} : ${m.result[1]}</div>`:`<div class="match-pending">ожидается</div>`;
    const chips=PLAYERS.map(p=>{
      const bet=m.bets[p];
      const r=bet&&m.result?calcScore(bet,m.result):null;
      const col=r?TC[r.type]:bet?'var(--sub)':'var(--muted)';
      const pts=r?`<span style="font-size:0.7rem;margin-left:4px">${r.pts>0?'+'+r.pts:'✕'}</span>`:'';
      return`<div class="bet-chip"><div class="bet-chip-name">${p}</div><div class="bet-chip-val" style="color:${col}">${bet?bet[0]+':'+bet[1]:'—'}${pts}</div></div>`;
    }).join('');
    return`<div class="match-card"><div class="match-head"><div><div class="match-title">${m.home} — ${m.away}</div><div class="match-date">${m.date}</div></div>${scoreEl}</div><div class="bets-row">${chips}</div></div>`;
  }).join('');
}

function renderRules(){
  document.getElementById('panel-rules').innerHTML=RULES.map(r=>`<div class="rule-card"><div class="rule-num">${r.num}</div><div class="rule-text">${r.text}</div></div>`).join('')+
  `<div class="scoring-box"><div style="color:var(--sub);font-weight:600;margin-bottom:6px">Система начисления очков</div>
  <div>🎯 Точный счёт — <span style="color:var(--teal);font-weight:700">3 очка</span></div>
  <div style="margin-top:4px">↕️ Разница мячей — <span style="color:var(--blue);font-weight:700">2 очка</span></div>
  <div style="margin-top:4px">✓ Исход — <span style="color:var(--purple);font-weight:700">1 очко</span></div></div>`;
}

renderAll();
</script>
</body>
</html>
